[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odecast"
dynamic = ["version"]
description = "A Python library for solving higher-order ordinary differential equations (ODEs) without manual reduction."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Matthias Baer", email = "matthias.r.baer@googlemail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy", "scipy", "sympy"]

[project.optional-dependencies]
# Kept for backwards compatibility; numpy, scipy and sympy are now core dependencies.
math = ["matplotlib"]
examples = ["matplotlib", "pandas"]
dev = ["pytest", "pytest-cov", "ruff==0.17.1", "black==26.10.1", "matplotlib", "pandas"]

[project.urls]
Homepage = "https://github.com/maroba/odecast"
Repository = "https://github.com/maroba/odecast"

[tool.ruff.lint.per-file-ignores]
# Example scripts are numbered for reading order and catch broad exceptions
# so that a failing optional step does not abort the demonstration.
"examples/*.py" = ["N999", "BLE001"]

[tool.hatch.version]
path = "src/odecast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odecast"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests"]
